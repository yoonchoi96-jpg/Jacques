name: YouTube Provider Probe V2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run provider probe
        env:
          YOUTUBE_URL: https://www.youtube.com/watch?v=TiOpGgCXeT0
          PROVIDERS: chordidentifier,songscription
        run: python tools/youtube_provider_probe.py
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-provider-probe-v2
          path: probe_artifacts/
          retention-days: 7
