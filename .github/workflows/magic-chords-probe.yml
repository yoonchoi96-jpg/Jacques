name: Magic Chords YouTube Probe

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL to analyze"
        required: true
      track_id:
        description: "Optional Jacques track_id"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Run Magic Chords provider
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          PROVIDERS: magic_chords
          TRACK_ID: ${{ inputs.track_id }}
          PROVIDER_RETRIES: "2"
        run: python tools/youtube_provider_probe.py
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-chords-probe
          path: probe_artifacts/
          if-no-files-found: warn
          retention-days: 7
