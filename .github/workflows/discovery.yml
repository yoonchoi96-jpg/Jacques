name: Jacques Global Discovery

on:
  push:
    branches: ["main"]
    paths:
      - "src/music_db/discovery/**"
      - "tools/jacques_global_top3.py"
      - ".github/workflows/discovery.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of global chart tracks to analyze"
        required: false
        default: "3"
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: jacques-database-writer
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Jacques global discovery analysis
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          FREQBLOG_API_KEY: ${{ secrets.FREQBLOG_API_KEY }}
        run: |
          python -m compileall -q src tools
          python tools/jacques_global_top3.py --limit ${{ inputs.limit || '3' }}

      - name: Validate database
        run: |
          sqlite3 db/music.db "PRAGMA integrity_check;" | grep -qx "ok"
          python tools/db_quality.py --fail-on-error

      - name: Commit discovery report and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/music.db reports/discovery
          if git diff --cached --quiet; then
            echo "No discovery changes."
          else
            git commit -m "Automated Jacques global discovery analysis"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
