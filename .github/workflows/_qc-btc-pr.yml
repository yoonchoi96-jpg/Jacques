name: QC BTC Probe

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - 'src/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt yt-dlp playwright
          python -m playwright install --with-deps chromium
      - name: Run Methodic Truth + BTC probe
        env:
          YOUTUBE_URL: https://www.youtube.com/watch?v=TiOpGgCXeT0
          PROVIDERS: methodic_truth,btc_local
          PROVIDER_RETRIES: "2"
        run: python tools/youtube_provider_probe.py
      - name: Upload QC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-btc-probe
          path: probe_artifacts/
          if-no-files-found: warn
          retention-days: 3
