name: Temporary Songscription QC Probe
# rerun after navigate fix

on:
  push:
    paths:
      - ".github/workflows/_temporary-songscription-qc.yml"

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: tiop
            youtube_url: "https://www.youtube.com/watch?v=TiOpGgCXeT0"
          - id: mz4
            youtube_url: "https://www.youtube.com/watch?v=mZ4vjIC3tmw"
          - id: shape-of-you
            youtube_url: "https://www.youtube.com/watch?v=JGwWNGJdvx8"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Probe Methodic Truth + Songscription
        env:
          YOUTUBE_URL: ${{ matrix.youtube_url }}
          PROVIDERS: "methodic_truth,songscription"
          PROVIDER_RETRIES: "1"
        run: python tools/youtube_provider_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songscription-qc-${{ matrix.id }}
          path: probe_artifacts/
          if-no-files-found: warn
          retention-days: 7
