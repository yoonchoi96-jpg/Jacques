name: Spotify Music DB

on:
  workflow_dispatch:
    inputs:
      analysis_scope:
        description: "How many long-term Top tracks to analyze"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "10"
      analysis_providers:
        description: "External link-analysis providers"
        required: true
        default: "chordidentifier,methodic_truth,magic_chords"
        type: string

  push:
    paths-ignore:
      - "db/music.db"

  schedule:
    - cron: "0 0,8,15 * * *"

permissions:
  contents: write

concurrency:
  group: jacques-database-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install link-analysis tools
        run: |
          python -m pip install yt-dlp playwright
          python -m playwright install --with-deps chromium

      - name: Preflight
        run: |
          python --version
          python -m pip --version
          python -c "import bs4, spotipy; print('Dependencies OK')"
          python -m compileall -q spotify_to_db.py src tools
          python -c "import sys; sys.path.insert(0, 'src'); from music_db.database import initialize_database; initialize_database(); print('Schema OK')"

      - name: Run Spotify → SQLite → Enrichment
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          FREQBLOG_API_KEY: ${{ secrets.FREQBLOG_API_KEY }}
        run: |
          python spotify_to_db.py

      - name: Sync editorial and catalog sources
        run: |
          python tools/sync_editorial_sources.py

      - name: Validate SQLite
        run: |
          sqlite3 db/music.db "PRAGMA integrity_check;" | grep -qx "ok"
          python tools/db_quality.py --fail-on-error

      - name: Output Spotify Top 3 / Top 10 (Long Term)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import spotipy
          from spotipy.oauth2 import SpotifyOAuth

          oauth = SpotifyOAuth(
              client_id=os.environ["SPOTIFY_CLIENT_ID"],
              client_secret=os.environ["SPOTIFY_CLIENT_SECRET"],
              redirect_uri="http://127.0.0.1:8888/callback",
              scope="user-top-read",
          )
          token_info = oauth.refresh_access_token(os.environ["SPOTIFY_REFRESH_TOKEN"])
          sp = spotipy.Spotify(auth=token_info["access_token"])

          items = sp.current_user_top_tracks(limit=10, time_range="long_term").get("items", [])

          print("\n" + "=" * 60)
          print("SPOTIFY LONG-TERM TOP 3 / TOP 10")
          print("=" * 60)

          for i, track in enumerate(items, start=1):
              artists = ", ".join(a.get("name", "") for a in track.get("artists", []))
              print(f"{i:>2}. {track.get('name', '')} — {artists}")
              if i == 3:
                  print("-" * 60)

          print("=" * 60)
          PY

      - name: Analyze Spotify Top tracks via YouTube providers
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-analysis]')) }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          JACQUES_TOP_N: ${{ inputs.analysis_scope || '3' }}
          JACQUES_PROVIDERS: ${{ inputs.analysis_providers || 'chordidentifier,methodic_truth,magic_chords' }}
          PROVIDER_RETRIES: "2"
        run: |
          python tools/analyze_top_tracks.py

      - name: Upload analysis artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacques-top-track-analysis-${{ github.run_id }}
          path: probe_artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add db/music.db

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Automated music database sync"
            # The repository may receive a code/config commit while the
            # scheduled job is enriching. Rebase the generated DB commit
            # onto the latest main before pushing to avoid non-fast-forward
            # failures.
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Binary DB conflict during rebase; keeping the generated runner DB."
              git checkout --theirs db/music.db
              git add db/music.db
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:main
          fi
