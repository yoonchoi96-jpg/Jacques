name: Spotify Music DB

on:
  workflow_dispatch:
    inputs:
      analysis_scope:
        description: "How many long-term Top tracks to analyze"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "10"
      analysis_providers:
        description: "External link-analysis providers"
        required: true
        default: "chordidentifier,methodic_truth,magic_chords"
        type: string

  push:
    paths:
      - "src/**"
      - "spotify_to_db.py"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/spotify.yml"

  schedule:
    - cron: "0 0,8,15 * * *"

permissions:
  contents: write

concurrency:
  group: jacques-database-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Spotify credentials are available
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          required = [
              "SPOTIFY_CLIENT_ID",
              "SPOTIFY_CLIENT_SECRET",
              "SPOTIFY_REFRESH_TOKEN",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required Spotify Actions secrets: " + ", ".join(missing))
          print("Spotify Actions credentials present (values not printed).")
          PY

      - name: Preflight - Dry run check
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python spotify_to_db.py --dry-run || echo "Dry run preview completed"

      - name: Install link-analysis tools
        run: |
          python -m pip install yt-dlp playwright

      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Preflight
        run: |
          python --version
          python -m pip --version
          python -c "import bs4, spotipy; print('Dependencies OK')"
          python -m compileall -q spotify_to_db.py src tools
          python -c "import sys; sys.path.insert(0, 'src'); from music_db.database import initialize_database; initialize_database(); print('Schema OK')"

      - name: Run Spotify → SQLite → Enrichment
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          FREQBLOG_API_KEY: ${{ secrets.FREQBLOG_API_KEY }}
        run: |
          python spotify_to_db.py

      - name: Sync editorial and catalog sources
        run: |
          python tools/sync_editorial_sources.py

      - name: Validate SQLite
        run: |
          sqlite3 db/music.db "PRAGMA integrity_check;" | grep -qx "ok"
          python tools/db_quality.py --fail-on-error

      - name: Output Spotify Top 3 / Top 10 (Long Term)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import spotipy
          from spotipy.oauth2 import SpotifyOAuth

          oauth = SpotifyOAuth(
              client_id=os.environ["SPOTIFY_CLIENT_ID"],
              client_secret=os.environ["SPOTIFY_CLIENT_SECRET"],
              redirect_uri="http://127.0.0.1:8888/callback",
              scope="user-top-read",
          )
          token_info = oauth.refresh_access_token(os.environ["SPOTIFY_REFRESH_TOKEN"])
          sp = spotipy.Spotify(auth=token_info["access_token"])

          items = sp.current_user_top_tracks(limit=10, time_range="long_term").get("items", [])

          print("\n" + "=" * 60)
          print("SPOTIFY LONG-TERM TOP 3 / TOP 10")
          print("=" * 60)

          for i, track in enumerate(items, start=1):
              artists = ", ".join(a.get("name", "") for a in track.get("artists", []))
              print(f"{i:>2}. {track.get('name', '')} — {artists}")
              if i == 3:
                  print("-" * 60)

          print("=" * 60)
          PY

      - name: Analyze Spotify Top tracks via YouTube providers
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' }}
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          JACQUES_TOP_N: ${{ inputs.analysis_scope || '3' }}
          JACQUES_PROVIDERS: ${{ inputs.analysis_providers || 'chordidentifier,methodic_truth,magic_chords' }}
          PROVIDER_RETRIES: "2"
        run: |
          python tools/analyze_top_tracks.py

      - name: Build consolidated Top track analysis
        if: ${{ always() }}
        continue-on-error: true
        run: |
          python tools/build_top_analysis_report.py

      - name: Upload analysis artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacques-top-track-analysis-${{ github.run_id }}
          path: probe_artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit database changes
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          base_db="$(mktemp)"
          runner_db="$(mktemp)"
          latest_db="$(mktemp)"
          merged_db="$(mktemp)"
          git show "${GITHUB_SHA}:db/music.db" > "$base_db"
          cp db/music.db "$runner_db"

          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:db/music.db > "$latest_db"
            python tools/safe_merge_database.py \
              --base "$base_db" \
              --runner "$runner_db" \
              --latest "$latest_db" \
              --output "$merged_db"

            git reset --hard origin/main
            cp "$merged_db" db/music.db
            git add db/music.db

            if git diff --cached --quiet; then
              echo "No database changes."
              exit 0
            fi

            git commit -m "Automated music database sync"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Database push raced with another main update; retrying safe merge ($attempt/3)."
          done

          echo "Could not push the safely merged database after three attempts."
          exit 1

# Jacques automated analysis trigger
