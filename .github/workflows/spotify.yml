name: Spotify Music DB

on:
  # Temporary runtime verification trigger; removed after the first successful run.
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 0,8,15 * * *"

permissions:
  contents: write

concurrency:
  group: spotify-music-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight
        run: |
          python --version
          python -m pip --version
          python -c "import bs4, spotipy; print('Dependencies OK')"
          python -m compileall -q spotify_to_db.py src tools
          python -c "import sys; sys.path.insert(0, 'src'); from music_db.database import initialize_database; initialize_database(); print('Schema OK')"

      - name: Run Spotify → SQLite → Enrichment
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          FREQBLOG_API_KEY: ${{ secrets.FREQBLOG_API_KEY }}
        run: |
          python spotify_to_db.py

      - name: Validate SQLite
        run: |
          sqlite3 db/music.db "PRAGMA integrity_check;" | grep -qx "ok"
          python tools/db_quality.py

      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add db/music.db

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Automated music database sync"
            git push
          fi
