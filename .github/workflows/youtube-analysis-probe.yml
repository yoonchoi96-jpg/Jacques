name: YouTube Music Analysis Probe

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL to analyze"
        required: true
        default: "https://www.youtube.com/watch?v=TiOpGgCXeT0"
      providers:
        description: "Comma-separated providers"
        required: true
        default: "methodic_truth,essentia_local,mazmazika,chordidentifier,magic_chords"
      track_id:
        description: "Optional Jacques track_id; persists returned provider evidence when supplied"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt yt-dlp playwright
          python -m playwright install --with-deps chromium

      - name: TEMP BTC API smoke test
        run: |
          python - <<'PY'
          import librosa, requests, time
          path = librosa.ex('trumpet')
          with open(path, 'rb') as f:
              r = requests.post('https://jeremyszs-chord-engine.hf.space/api/v1/jobs', files={'audio': ('sample.wav', f, 'audio/wav')}, timeout=90)
          print('SUBMIT', r.status_code, r.text[:2000])
          r.raise_for_status()
          job = r.json()['job_id']
          for _ in range(36):
              time.sleep(5)
              s = requests.get(f'https://jeremyszs-chord-engine.hf.space/api/v1/jobs/{job}/status', timeout=30)
              print('STATUS', s.status_code, s.text[:1000])
              s.raise_for_status()
              if s.json().get('status') == 'completed':
                  out = requests.get(f'https://jeremyszs-chord-engine.hf.space/api/v1/jobs/{job}/result', timeout=30)
                  print('RESULT', out.status_code, out.text[:12000])
                  out.raise_for_status()
                  break
          else:
              raise RuntimeError('BTC probe timed out')
          PY

      - name: Run provider probe
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          PROVIDERS: ${{ inputs.providers }}
          TRACK_ID: ${{ inputs.track_id }}
          PROVIDER_RETRIES: "2"
        run: |
          python tools/youtube_provider_probe.py

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-provider-probe
          path: probe_artifacts/
          if-no-files-found: warn
          retention-days: 7
