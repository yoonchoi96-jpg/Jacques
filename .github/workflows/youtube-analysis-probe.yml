name: YouTube Music Analysis Probe

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL to analyze"
        required: true
        default: "https://www.youtube.com/watch?v=TiOpGgCXeT0"
      providers:
        description: "Comma-separated providers"
        required: true
        default: "chordidentifier,songscription"
      track_id:
        description: "Optional Jacques track_id; persists returned provider evidence when supplied"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run provider probe
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          PROVIDERS: ${{ inputs.providers }}
          TRACK_ID: ${{ inputs.track_id }}
        run: |
          python tools/youtube_provider_probe.py

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-provider-probe
          path: probe_artifacts/
          if-no-files-found: warn
          retention-days: 7
