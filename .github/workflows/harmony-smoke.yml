name: Jacques Harmony Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install core and audio analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-audio.txt

      - name: Compile
        run: python -m compileall -q src tools

      - name: Database migration and harmony schema smoke test
        run: |
          python - <<'PY'
          import sqlite3
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("src")))
          from music_db.database import initialize_database
          initialize_database()
          conn = sqlite3.connect("db/music.db")
          expected = {
              "harmony_sources",
              "harmony_segments",
              "harmony_consensus",
              "harmony_profiles",
          }
          found = {
              row[0] for row in conn.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          missing = expected - found
          if missing:
              raise SystemExit(f"Missing harmony tables: {sorted(missing)}")
          print("Harmony schema OK")
          conn.close()
          PY

      - name: CLI import smoke test
        run: python tools/harmony_analyze.py --help
