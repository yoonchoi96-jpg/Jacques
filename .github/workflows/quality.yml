name: Jacques Quality Gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-audio.txt"
      - "spotify_to_db.py"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: jacques-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q src tools

      - name: Import smoke test
        run: PYTHONPATH=src python tools/validate_install.py

      - name: Generation regression tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p "test_*.py" -v

      - name: Database integrity
        run: |
          PYTHONPATH=src python -c "from music_db.database import initialize_database; initialize_database()"
          sqlite3 db/music.db "PRAGMA integrity_check;" | grep -qx "ok"

      - name: Database quality
        run: PYTHONPATH=src python tools/db_quality.py --fail-on-error

      - name: Schema smoke test
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("db/music.db")
          required = {
              "tracks", "audio_features", "audio_feature_sources",
              "chart_entries", "review_entries", "source_records",
              "generation_jobs", "generation_outputs",
              "generation_analysis", "generation_relations",
              "audio_analysis_cache",
          }
          actual = {r[0] for r in c.execute(
              "select name from sqlite_master where type='table'"
          )}
          missing = sorted(required - actual)
          assert not missing, f"Missing tables: {missing}"
          print("Required tables:", len(required))
          PY


  audio-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install audio stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-audio.txt
      - name: Analyze synthetic audio and verify cache
        run: |
          python - <<'PY'
          import math
          import soundfile as sf
          import numpy as np
          from pathlib import Path
          p = Path("/tmp/jacques_test.wav")
          sr = 22050
          t = np.arange(sr * 5) / sr
          y = 0.2 * np.sin(2 * math.pi * 440 * t)
          sf.write(p, y, sr)
          PY

          PYTHONPATH=src python - <<'PY'
          import sqlite3
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from music_db.generation.audio_analysis import analyze_and_store, analyze_audio

          audio = "/tmp/jacques_test.wav"
          result = analyze_audio(audio)
          assert result["analysis_version"] == "audio_features_v4"
          assert result["sample_rate"] == 22050
          assert result["duration_seconds"] > 4.9
          assert "mfcc_mean" in result
          assert "spectral_contrast_mean_db" in result
          print("Audio analysis v4 OK")

          with TemporaryDirectory() as td:
              db = sqlite3.connect(Path(td) / "cache.db")
              db.row_factory = sqlite3.Row
              db.executescript("""
              CREATE TABLE generation_outputs (
                  output_id INTEGER PRIMARY KEY,
                  duration_seconds REAL,
                  bpm REAL,
                  sample_rate INTEGER,
                  format TEXT,
                  analysis_json TEXT
              );
              CREATE TABLE generation_analysis (
                  output_id INTEGER,
                  analysis_type TEXT,
                  payload_json TEXT,
                  created_at TEXT
              );
              CREATE TABLE audio_analysis_cache (
                  fingerprint_sha256 TEXT NOT NULL,
                  analysis_type TEXT NOT NULL,
                  payload_json TEXT NOT NULL,
                  created_at TEXT,
                  updated_at TEXT,
                  PRIMARY KEY (fingerprint_sha256, analysis_type)
              );
              """)
              db.execute("INSERT INTO generation_outputs(output_id) VALUES (1)")
              db.commit()

              analyze_and_store(db, 1, audio)
              assert db.execute("SELECT COUNT(*) FROM audio_analysis_cache").fetchone()[0] == 1

              with patch("music_db.generation.audio_analysis.analyze_audio",
                         side_effect=AssertionError("DSP recomputed despite cache")):
                  analyze_and_store(db, 1, audio)

              assert db.execute("SELECT COUNT(*) FROM audio_analysis_cache").fetchone()[0] == 1
              print("DSP fingerprint cache OK")
              db.close()
          PY
