name: Jacques Quality Gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - "spotify_to_db.py"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: jacques-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q src tools

      - name: Import smoke test
        run: PYTHONPATH=src python tools/validate_install.py

      - name: Generation regression tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p "test_*.py" -v

      - name: Database integrity
        run: |
          PYTHONPATH=src python -c "from music_db.database import initialize_database; initialize_database()"
          sqlite3 db/music.db "PRAGMA integrity_check;" | grep -qx "ok"

      - name: Database quality
        run: PYTHONPATH=src python tools/db_quality.py --fail-on-error

      - name: Jacques personal listening Top 3 (current DB)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          FREQBLOG_API_KEY: ${{ secrets.FREQBLOG_API_KEY }}
        run: |
          python tools/jacques_global_top3.py --limit 3

      - name: Schema smoke test
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("db/music.db")
          required = {
              "tracks", "audio_features", "audio_feature_sources",
              "chart_entries", "review_entries", "source_records",
              "generation_jobs", "generation_outputs",
              "generation_analysis", "generation_relations",
              "audio_analysis_cache", "track_media_links",
          }
          actual = {r[0] for r in c.execute(
              "select name from sqlite_master where type='table'"
          )}
          missing = sorted(required - actual)
          assert not missing, f"Missing tables: {missing}"
          assert "audio_library_assets" not in actual, "Local audio table must not exist"
          print("Streaming-only media input schema OK")
          print("Required tables:", len(required))
          PY

