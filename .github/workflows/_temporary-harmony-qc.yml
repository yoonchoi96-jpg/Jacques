name: Temporary Harmony QC Probe
# Re-run after yt-dlp acquisition fix

on:
  push:
    paths:
      - ".github/workflows/_temporary-harmony-qc.yml"

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: tiop
            youtube_url: "https://www.youtube.com/watch?v=TiOpGgCXeT0"
          - id: mz4
            youtube_url: "https://www.youtube.com/watch?v=mZ4vjIC3tmw"
          - id: shape-of-you
            youtube_url: "https://www.youtube.com/watch?v=JGwWNGJdvx8"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up Deno for yt-dlp YouTube EJS
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "yt-dlp[default]" playwright
          python -m playwright install --with-deps chromium
      - name: Diagnose direct YouTube browser access
        env:
          YOUTUBE_URL: ${{ matrix.youtube_url }}
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              page = b.new_page()
              page.goto(os.environ["YOUTUBE_URL"], wait_until="domcontentloaded", timeout=30000)
              print("TITLE:", page.title())
              print("URL:", page.url)
              print("BODY:", page.locator("body").inner_text(timeout=10000)[:1200])
              b.close()
          PY

      - name: Diagnose Chordify URL search
        env:
          YOUTUBE_URL: ${{ matrix.youtube_url }}
        run: |
          python - <<'PY'
          import os, urllib.parse
          from playwright.sync_api import sync_playwright
          target = "https://chordify.net/?search=" + urllib.parse.quote(os.environ["YOUTUBE_URL"], safe="")
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              page = b.new_page()
              page.goto(target, wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(5000)
              print("CHORDIFY_URL:", page.url)
              print("CHORDIFY_TITLE:", page.title())
              print("CHORDIFY_BODY:", page.locator("body").inner_text(timeout=10000)[:2500])
              b.close()
          PY

      - name: Run Methodic Truth + Essentia
        env:
          YOUTUBE_URL: ${{ matrix.youtube_url }}
          PROVIDERS: "methodic_truth,essentia_local"
          PROVIDER_RETRIES: "1"
        run: python tools/youtube_provider_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-qc-${{ matrix.id }}
          path: probe_artifacts/
          if-no-files-found: warn
          retention-days: 7
